global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/recording-rules.yml

scrape_configs:
  # App-level metrics from Nest (/metrics on 3001)
  - job_name: api-app
    static_configs:
      - targets: ["api-blue:3001", "api-green:3001"]

  # (Keep the OTEL exporter if you already had it)
  - job_name: api-otel
    static_configs:
      - targets: ["api-blue:9464", "api-green:9464"]

  # Prometheus self
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
