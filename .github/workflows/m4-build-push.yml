name: M4 - Build & Push Images (GHCR)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Compute lower-case image names that always work (push or dispatch)
      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          REPO_LOWER="${GITHUB_REPOSITORY,,}"           # owner/name (lowercase)
          SHA="$GITHUB_SHA"

          echo "IMAGE_API=ghcr.io/${REPO_LOWER}-api:${SHA}"       >> $GITHUB_ENV
          echo "IMAGE_WEB=ghcr.io/${REPO_LOWER}-web:${SHA}"       >> $GITHUB_ENV
          echo "IMAGE_API_LATEST=ghcr.io/${REPO_LOWER}-api:latest" >> $GITHUB_ENV
          echo "IMAGE_WEB_LATEST=ghcr.io/${REPO_LOWER}-web:latest" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}
            ${{ env.IMAGE_API_LATEST }}

      - name: Build & push Web
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}
            ${{ env.IMAGE_WEB_LATEST }}

      - name: Show tags
        run: |
          echo "::notice title=API::${IMAGE_API}"
          echo "::notice title=WEB::${IMAGE_WEB}"
