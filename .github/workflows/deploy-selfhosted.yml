name: Deploy (Self-hosted Windows)

on:
  workflow_dispatch:
    inputs:
      api_image:
        description: "GHCR image for API (e.g., ghcr.io/user/repo-api:sha-xxxx)"
        required: true
      web_image:
        description: "GHCR image for Web (e.g., ghcr.io/user/repo-web:sha-xxxx)"
        required: true
      smoke:
        description: "Run smoke test after switch?"
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]

    # make secrets available to every step
    env:
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN:    ${{ secrets.GHCR_TOKEN }}

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sanity: confirm we actually received non-empty secrets (masked in logs)
      - name: Debug (lengths only)
        run: |
          if (-not "$env:GHCR_USERNAME" -or -not "$env:GHCR_TOKEN") { throw "Secrets missing" }
          Write-Host "Username length: $($env:GHCR_USERNAME.Length)"
          Write-Host "Token length: $($env:GHCR_TOKEN.Length)"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ env.GHCR_TOKEN }}

      - name: Pull images (API/Web)
        run: |
          docker pull "${{ inputs.api_image }}"
          docker pull "${{ inputs.web_image }}"

      - name: Deploy (PowerShell blue/green)
        run: |
          $smoke = [bool]::Parse("${{ inputs.smoke }}")
          .\scripts\deploy.ps1 -ApiImage "${{ inputs.api_image }}" -WebImage "${{ inputs.web_image }}" -Smoke:$smoke
